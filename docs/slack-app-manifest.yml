# Host Hampton — Slack app manifest (plan §25.4)
#
# Paste into https://api.slack.com/apps -> Create New App -> From a manifest.
# See slack-app-setup.md for the rest of the handover.
#
# Scopes are the minimum the reviewer loop needs.
#   channels:history — REQUIRED by Slack for the message.channels event below;
#     there is no way to receive a thread reply as a free-text revision without
#     it (confirmed against Slack's own manifest validator, 2026-09-13). The
#     blast radius is smaller than it looks: the bot is only ever invited to
#     #hh-leads, so in practice this reads that one channel, not the workspace.
# Deliberately ABSENT:
#   groups:history — no private-channel reading; #hh-leads is public.
#   chat:write.customize — no custom username/icon. The app posting as itself
#     is what makes "who approved this" answerable.
#   users:read.email — the Slack user_id maps to an admin_users row by an id we
#     configure, not by harvesting email addresses.
display_information:
  name: Host Hampton
  description: Lead drafts for review, one thread per lead.
  background_color: "#1a2744"

features:
  bot_user:
    display_name: Host Hampton
    # The app posts and responds; it does not need to look online.
    always_online: false

oauth_config:
  scopes:
    bot:
      # Post the draft, and post revisions into its thread.
      - chat:write
      # Post to #hh-leads without the app having to be re-invited after a
      # channel is recreated. Does NOT grant reading the channel.
      - chat:write.public
      # Resolve a verified user_id to a display name for the ledger actor.
      - users:read
      # Required by Slack for the message.channels event subscription — reads
      # only #hh-leads, the one channel the bot is ever invited to.
      - channels:history

settings:
  interactivity:
    is_enabled: true
    # Approve / Cancel / Test buttons and the edit modal.
    #
    # Safe to set here: Slack does NOT send a verification handshake to an
    # interactivity URL. It is only called when somebody presses a button.
    request_url: https://www.hosthampton.com/api/slack/interactions
  #
  # event_subscriptions IS DELIBERATELY ABSENT. Add it in step 6, not here.
  #
  # Slack verifies an events URL the moment the manifest is saved, by POSTing a
  # SIGNED `url_verification` challenge. `/api/slack/events` gives that
  # handshake no exemption from the fail-closed signature check — an unset
  # SLACK_SIGNING_SECRET is a rejection, not a skip — so at app-creation time,
  # before the secret is on the box, it answers 401 and Slack marks the URL
  # unverified. That reads exactly like a broken endpoint and it is not one.
  #
  # The previous version of this file included the block and documented the
  # trap in prose. Prose loses: leaving it out means the wrong order cannot be
  # taken. Paste this, get the signing secret deployed, THEN add:
  #
  #   Event Subscriptions -> Enable Events
  #   Request URL: https://www.hosthampton.com/api/slack/events
  #   Subscribe to bot events: message.channels
  #
  # It goes green first time, because by then the secret is live.
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
