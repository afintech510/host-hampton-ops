
services:

  # ─── REVERSE PROXY ───────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: hampton_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/ssl/hosthampton:/etc/ssl/hosthampton:ro
    depends_on:
      - website
    networks:
      - hampton_net

