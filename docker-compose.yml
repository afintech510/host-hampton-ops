  # ─── WEBSITE (Next.js) ────────────────────────────────────────
  website:
    build:
      context: ./services/website
      args:
        NEXT_PUBLIC_GA_ID: ${NEXT_PUBLIC_GA_ID:-G-BX1DJ77T15}
        NEXT_PUBLIC_GADS_ID: ${NEXT_PUBLIC_GADS_ID:-AW-16667795146}
        NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY}
    container_name: hampton_website
    restart: unless-stopped
    environment:
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_KEY}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_REFRESH_TOKEN=${GOOGLE_REFRESH_TOKEN}
      - GOOGLE_CALENDAR_ID=${GOOGLE_CALENDAR_ID:-}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - RESEND_FROM_EMAIL=${RESEND_FROM_EMAIL}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - CRON_SECRET=${CRON_SECRET}
      - BREVO_API_KEY=${BREVO_API_KEY}
      - BREVO_DEFAULT_LIST_ID=${BREVO_DEFAULT_LIST_ID:-}
      - BREVO_SENDER_EMAIL=${BREVO_SENDER_EMAIL:-hosthampton295@gmail.com}
      - TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID}
      - TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN}
      - TWILIO_PHONE_NUMBER=${TWILIO_PHONE_NUMBER}
      # Quo SMS (formerly Grasshopper). SMS_PROVIDER selects the send path;
      # defaults to twilio when unset. Flip to 'quo' to cut transactional SMS over.
      - SMS_PROVIDER=${SMS_PROVIDER:-twilio}
      - QUO_API_KEY=${QUO_API_KEY:-}
      - QUO_PHONE_NUMBER=${QUO_PHONE_NUMBER:-}
      - QUO_USER_ID=${QUO_USER_ID:-}
      # Standard-Webhooks signing secret for /api/webhooks/quo (opt-out sync)
      - QUO_WEBHOOK_SECRET=${QUO_WEBHOOK_SECRET:-}
      # Owner notifications (lib/ownerNotify.ts). REVIEWER_PHONES is a comma-
      # separated E.164 list that receives lead/booking-agent SMS via Quo;
      # empty = no owner SMS.
      - OWNER_NOTIFY_EMAIL=${OWNER_NOTIFY_EMAIL:-hosthampton295@gmail.com}
      - REVIEWER_PHONES=${REVIEWER_PHONES:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      # Booking agent (lib/agent/*, /api/cron/agent-dispatch). AGENT_ENABLED is
      # the kill switch: with it off the dispatcher claims nothing, spends
      # nothing and sends nothing, while inbound events are still recorded.
      # AGENT_DAILY_USD_CAP is a hard daily ceiling on agent LLM spend.
      - AGENT_ENABLED=${AGENT_ENABLED:-false}
      - AGENT_DRAFT_MODEL=${AGENT_DRAFT_MODEL:-claude-sonnet-5}
      - AGENT_TRIAGE_MODEL=${AGENT_TRIAGE_MODEL:-claude-haiku-4-5-20251001}
      - AGENT_DAILY_USD_CAP=${AGENT_DAILY_USD_CAP:-5}
      - PORTAL_LINK_SIGNING_SECRET=${PORTAL_LINK_SIGNING_SECRET}
      # HMAC secret for /review/<token> draft previews. Falls back to
      # PORTAL_LINK_SIGNING_SECRET when unset.
      - REVIEW_LINK_SIGNING_SECRET=${REVIEW_LINK_SIGNING_SECRET:-}
      # Gmail ingestion (lib/gmail.ts, /api/cron/gmail-sync). A SEPARATE OAuth
      # grant from GOOGLE_* above: this one is gmail.readonly + gmail.modify on
      # hosthampton295@gmail.com and has NO send scope, so it cannot email a
      # customer. GOOGLE_REFRESH_TOKEN is calendar-only and must never be
      # re-consented for Gmail — it powers live availability.
      # Unset is a supported state: /api/cron/gmail-sync reports configured:false.
      - GMAIL_CLIENT_ID=${GMAIL_CLIENT_ID:-}
      - GMAIL_CLIENT_SECRET=${GMAIL_CLIENT_SECRET:-}
      - GMAIL_REFRESH_TOKEN=${GMAIL_REFRESH_TOKEN:-}
      - GMAIL_USER=${GMAIL_USER:-hosthampton295@gmail.com}
      - GMAIL_HANDLED_LABEL=${GMAIL_HANDLED_LABEL:-HH-Agent/Handled}
      - VENMO_HANDLE=${VENMO_HANDLE:-@hosthampton}
      - ZELLE_PHONE=${ZELLE_PHONE}
      - SIGNWELL_API_KEY=${SIGNWELL_API_KEY}
      - SIGNWELL_TEMPLATE_ID=${SIGNWELL_TEMPLATE_ID}
      # Separate template for the pre-arrival check-in (rental agreement +
      # liability waiver). Distinct from SIGNWELL_TEMPLATE_ID above, which is
      # the studio rental agreement. Without this mapping the var never reaches
      # the container and /checkin reports the agreement as unavailable.
      - SIGNWELL_CHECKIN_TEMPLATE_ID=${SIGNWELL_CHECKIN_TEMPLATE_ID}
      - SIGNWELL_TEST_MODE=${SIGNWELL_TEST_MODE:-false}
      - SIGNWELL_SIGNER_PLACEHOLDER=${SIGNWELL_SIGNER_PLACEHOLDER:-Client}
    networks:
      - hampton_net

