name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-host-hampton-ops
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH (website only — scripts/deploy.sh does the ff-only pull; respects skip-worktree nginx.conf)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          command_timeout: 20m
          script: |
            set -e
            cd /opt/hosthampton
            bash scripts/deploy.sh website
            curl -fsS --max-time 10 --retry 4 --retry-delay 3 --retry-connrefused --resolve www.hosthampton.com:443:127.0.0.1 https://www.hosthampton.com/ >/dev/null \
              && echo "health OK (www.hosthampton.com)" \
              || echo "WARN: health check did not pass (deploy applied)"
