worker_processes 1;

events {
  worker_connections 1024;
}

http {
  include       mime.types;
  default_type  application/octet-stream;

  sendfile on;
  keepalive_timeout 65;

  # Allow uploads up to 15MB (mobile photos can be 5-12MB)
  client_max_body_size 15m;

  # Use Docker's embedded DNS so upstream hostnames re-resolve after container restarts
  resolver 127.0.0.11 valid=5s;

  # Next.js website upstream
  upstream website {
    server website:3002;
  }

  # ── Redirect HTTP → HTTPS ──────────────────────────────────
  server {
    listen 80;
    server_name staging.hosthampton.com www.hosthampton.com;
    return 301 https://$host$request_uri;
  }

  # ── HTTPS — Website staging + production ──────────────────
  server {
    listen 443 ssl;
    server_name staging.hosthampton.com www.hosthampton.com;

    ssl_certificate     /etc/ssl/hosthampton/origin.pem;
    ssl_certificate_key /etc/ssl/hosthampton/origin.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    location / {
      proxy_pass         http://website;
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
      proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
      proxy_read_timeout 60s;
    }
  }
}
