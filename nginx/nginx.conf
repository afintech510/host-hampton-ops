  # HTTPS - n8n editor (websocket)
  server {
    listen 443 ssl;
    server_name n8n.benchworksai.com;

    ssl_certificate     /etc/ssl/benchworksai/origin.pem;
    ssl_certificate_key /etc/ssl/benchworksai/origin.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    location / {
      set $n8n http://benchworks-outbound-n8n-1:5678;
      proxy_pass       $n8n;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 300s;
      proxy_buffering off;
    }
  }


  # HTTP -> HTTPS redirect (Cloudflare Full strict; direct-IP visitors only)
  server {
    listen 80;
    server_name benchworksai.com www.benchworksai.com app.benchworksai.com n8n.benchworksai.com;
    return 301 https://$host$request_uri;
  }



