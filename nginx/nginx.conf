worker_processes 1;

events {
  worker_connections 1024;
}

http {
  include       mime.types;
  default_type  application/octet-stream;

  sendfile on;
  keepalive_timeout 65;

  # Use Docker's embedded DNS so upstream hostnames re-resolve after container restarts
  resolver 127.0.0.11 valid=5s;

  # ── HAMPTON Orchestrator ───────────────────────────────────
  upstream hampton {
    server hampton:3000;
  }

  # Dashboard frontend (Vercel build served on VPS as static assets)
  upstream frontend {
    server frontend:80;
  }

  # Default HTTP server (direct-IP access)
  # - API stays available at /
  # - Dashboard is available at /app (and /assets for Vite bundle paths)
  server {
    listen 80 default_server;
    server_name _;

    # Dashboard
    location = /app { return 302 /app/; }
    location /app/ {
      proxy_pass       http://frontend/;
      proxy_set_header Host $host;
      proxy_read_timeout 30s;
    }

    # Vite build assets are typically rooted at /assets/
    location /assets/ {
      proxy_pass       http://frontend/assets/;
      proxy_set_header Host $host;
      proxy_read_timeout 30s;
    }

    # WebSocket support (direct-IP testing)
    location /ws {
      proxy_pass         http://hampton;
      proxy_http_version 1.1;
      proxy_set_header   Upgrade $http_upgrade;
      proxy_set_header   Connection "upgrade";
      proxy_set_header   Host $host;
      proxy_read_timeout 3600s;
    }

    # Default: API
    location / {
      proxy_pass         http://hampton;
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
      proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
      proxy_read_timeout 60s;
    }
  }

  # ── Redirect HTTP → HTTPS ──────────────────────────────────
  server {
    listen 80;
    server_name api.hosthampton.com app.hosthampton.com;
    return 301 https://$host$request_uri;
  }

  # ── HTTPS — Dashboard (app.hosthampton.com) ────────────────
  server {
    listen 443 ssl;
    server_name app.hosthampton.com;

    ssl_certificate     /etc/ssl/hosthampton/origin.pem;
    ssl_certificate_key /etc/ssl/hosthampton/origin.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Vite assets served from frontend container root
    location /assets/ {
      proxy_pass       http://frontend/assets/;
      proxy_set_header Host $host;
      proxy_read_timeout 30s;
    }

    # SPA — serve index.html for all routes
    location / {
      proxy_pass       http://frontend/;
      proxy_set_header Host $host;
      proxy_read_timeout 30s;
    }
  }

  # ── HTTPS (Cloudflare Origin Certificate) ──────────────────
  server {
    listen 443 ssl;
    server_name api.hosthampton.com;

    ssl_certificate     /etc/ssl/hosthampton/origin.pem;
    ssl_certificate_key /etc/ssl/hosthampton/origin.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # WebSocket support
    location /ws {
      proxy_pass         http://hampton;
      proxy_http_version 1.1;
      proxy_set_header   Upgrade $http_upgrade;
      proxy_set_header   Connection "upgrade";
      proxy_set_header   Host $host;
      proxy_read_timeout 3600s;
    }

    # API — CORS handled entirely by Express middleware
    location / {
      proxy_pass         http://hampton;
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
      proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
      proxy_read_timeout 60s;
    }
  }
}
