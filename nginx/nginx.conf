worker_processes 1;

events {
  worker_connections 1024;
}

http {
  include       mime.types;
  default_type  application/octet-stream;

  sendfile on;
  keepalive_timeout 65;

  # Increase proxy buffer size for large auth cookies (Supabase PKCE)
  proxy_buffer_size 128k;
  proxy_buffers 4 256k;
  proxy_busy_buffers_size 256k;

  client_max_body_size 15m;

  resolver 127.0.0.11 valid=5s;

  # ── HTTP → HTTPS redirects ─────────────────────────────────
  server {
    listen 80;
    server_name staging.hosthampton.com www.hosthampton.com staging.easternlm.com easternlm.com www.easternlm.com mygravelguy.com www.mygravelguy.com pilates.hosthampton.com maningomethod.com www.maningomethod.com;
    return 301 https://$host$request_uri;
  }

  # ── Default HTTP (direct-IP) → orchestrator ────────────────
  server {
    listen 80 default_server;
    server_name _;

    location / {
      set $orch http://elm_orchestrator:3200;
      proxy_pass         $orch;
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
      proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
      proxy_read_timeout 60s;
    }
  }

  # ── HTTPS — EasternLM Staging ──────────────────────────────
  server {
    listen 443 ssl;
    server_name staging.easternlm.com;

    ssl_certificate     /etc/letsencrypt/live/staging.easternlm.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staging.easternlm.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    location / {
      set $elm_stg http://easternlm-staging:3000;
      proxy_pass         $elm_stg;
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
      proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
      proxy_read_timeout 60s;
    }
  }

  # ── HTTPS — EasternLM Production ───────────────────────────
  server {
    listen 443 ssl;
    server_name easternlm.com www.easternlm.com;

    ssl_certificate     /etc/ssl/hosthampton/origin.pem;
    ssl_certificate_key /etc/ssl/hosthampton/origin.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    location / {
      set $elm_prod http://easternlm-prod:3000;
      proxy_pass         $elm_prod;
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
      proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
      proxy_read_timeout 60s;
    }
  }

  # ── HTTPS — Host Hampton Website ───────────────────────────
  server {
    listen 443 ssl;
    server_name staging.hosthampton.com www.hosthampton.com;

    ssl_certificate     /etc/ssl/hosthampton/origin.pem;
    ssl_certificate_key /etc/ssl/hosthampton/origin.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    location / {
      set $hh_web http://hampton_website:3002;
      proxy_pass         $hh_web;
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
      proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
      proxy_read_timeout 60s;
    }
  }

  # ── HTTPS — MyGravelGuy ────────────────────────────────────
  server {
    listen 443 ssl;
    server_name mygravelguy.com www.mygravelguy.com;

    ssl_certificate     /etc/ssl/mygravelguy/origin.pem;
    ssl_certificate_key /etc/ssl/mygravelguy/origin.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    location /assets/ {
      set $mgg http://mygravelguy:80;
      proxy_pass       $mgg$request_uri;
      proxy_set_header Host $host;
      proxy_read_timeout 30s;
    }
    location / {
      set $mgg http://mygravelguy:80;
      proxy_pass       $mgg;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 30s;
    }
  }

  # ── HTTPS — Pilates (Maningo Method) ───────────────────────
  server {
    listen 443 ssl;
    server_name pilates.hosthampton.com;

    ssl_certificate     /etc/ssl/hosthampton/origin.pem;
    ssl_certificate_key /etc/ssl/hosthampton/origin.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    client_max_body_size 25m;

    location / {
      set $pilates http://maningo_app:3000;
      proxy_pass         $pilates;
      proxy_http_version 1.1;
      proxy_set_header   Host $host;
      proxy_set_header   Upgrade $http_upgrade;
      proxy_set_header   Connection "upgrade";
      proxy_set_header   X-Real-IP $remote_addr;
      proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
      proxy_read_timeout 60s;
    }
  }


  # ── HTTPS — Maningo Method (production) ───────────────────
  server {
    listen 443 ssl;
    server_name maningomethod.com www.maningomethod.com;

    ssl_certificate     /etc/ssl/maningomethod/origin.pem;
    ssl_certificate_key /etc/ssl/maningomethod/origin.key;
