worker_processes 1;

events {
  worker_connections 1024;
}

http {
  include       mime.types;
  default_type  application/octet-stream;

  sendfile on;
  keepalive_timeout 65;

  # ── HAMPTON Orchestrator ───────────────────────────────────
  upstream hampton {
    server hampton:3000;
  }

  # ── Redirect HTTP → HTTPS ──────────────────────────────────
  server {
    listen 80;
    server_name api.hosthampton.com;
    return 301 https://$host$request_uri;
  }

  # ── HTTPS (Cloudflare Origin Certificate) ──────────────────
  server {
    listen 443 ssl;
    server_name api.hosthampton.com;

    ssl_certificate     /etc/ssl/hosthampton/origin.pem;
    ssl_certificate_key /etc/ssl/hosthampton/origin.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # WebSocket support
    location /ws {
      proxy_pass         http://hampton;
      proxy_http_version 1.1;
      proxy_set_header   Upgrade $http_upgrade;
      proxy_set_header   Connection "upgrade";
      proxy_set_header   Host $host;
      proxy_read_timeout 3600s;
    }

    # API
    location / {
      if ($request_method = OPTIONS) {
        add_header Access-Control-Allow-Origin  "https://app.hosthampton.com";
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
        add_header Access-Control-Allow-Headers "Content-Type, Authorization";
        add_header Content-Length 0;
        return 204;
      }

      add_header Access-Control-Allow-Origin  "https://app.hosthampton.com" always;
      add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
      add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;

      proxy_pass         http://hampton;
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
      proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
      proxy_read_timeout 60s;
    }
  }
}
